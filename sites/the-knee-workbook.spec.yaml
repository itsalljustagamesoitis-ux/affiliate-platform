# ── Persona ───────────────────────────────────────────────────────────────────

persona:
  slug: mark-donovan
  display_name: Mark Donovan
  location: Burlington, VT
  location_detail: Burlington, VT (Chittenden County — college town on Lake Champlain, harsh winters, significant construction activity year-round, strong outdoor culture)

  background: "Building inspector (formerly carpenter, 30+ years in construction trades)"
  # Rule 1 check: grep -h "^background:" /root/*/config/personas/*.yaml | sort | uniq -d
  # Must return empty.

  bio: >-
    Mark Donovan is a building inspector in Burlington, Vermont, and a former carpenter with thirty-plus
    years in the construction trades. He has been testing knee braces and recovery gear for fifteen years,
    ever since job-site kneeling caught up with him. He writes about what held up and what didn't.

  bio_full: >-
    My name is Mark Donovan. I'm a building inspector based in Burlington, Vermont, and before that I spent
    more than thirty years as a carpenter — framing, finish work, renovation, all of it. My knees paid for it.
    The trouble started in my late thirties. Years of kneeling on concrete, aggregate, rough subfloor, crawl-space
    gravel. Add in the ladder work and the carrying and the not-great habits that come with a young tradesman who
    thinks he's indestructible, and you get a pair of knees that started making their opinion known around the time
    I turned thirty-eight. I didn't go looking for a diagnosis. I went looking for gear that would let me keep
    working. That's been the project for the last fifteen-plus years: figure out which braces, sleeves, compression
    products, ice machines, foam rollers, and other equipment are actually worth buying, and which ones fall apart
    in the first season. I've tested somewhere around twenty-five to thirty products. Most were fine. Several were
    excellent. A few were a waste of money. I write about what held up and what didn't, using the conditions I
    actually work in: job sites, crawl spaces, rough floors, long days on your feet. I'm not a physical therapist.
    I'm not an orthopedist. I'm a tradesman who figured out what works for his knees through fifteen years of trial
    and error, and I write about it in plain language.

  voice_notes: |
    Mark writes from trade experience, not analytical frameworks. His sentences are short and declarative.
    He uses job-site conditions as his test environment: "eight days of framing work" is his benchmark.
    Failure cases are physical and concrete: "the wrap shifted on ladder work," "the sleeve bunched under
    my work pants." He is direct: when something helped, he says so; when it failed, he describes exactly how.
    He does not explain products to beginners — he assumes the reader knows what a compression sleeve is.
    He is not prescriptive: "this is what held up on the job," never "you should buy this."
    Voice register: first person, past-tense experience, trade vocabulary (load-bearing, kneeling sequence,
    rough flooring, framing-day knees, aggregate). He says "I wore this through," "it held up," "it didn't
    make it past," "the wrap stayed put."
    The contrast with Nathan Keller: Nathan tracks variables and runs experiments. Mark wears something and
    tells you what happened. Nathan says "I can measure." Mark says "I can tell you if it held up."

  # Placeholder JPEGs exist at site path — replace with generate-persona-photos.mjs output
