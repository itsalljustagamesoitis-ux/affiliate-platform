# The Cordless Workshop — Site 24 spec
# Drafted 2026-07-01

# Photos: generate from pen portrait below — male persona, early 40s, flannel/henley,
# home workshop/garage setting. Must be visibly distinct from Dan Whitaker (3D printing)
# and Nathan Cole (cookware). After approval, set photo_source + about_photo_source
