# ── Navigation ─────────────────────────────────────────────────────────────────
# 12 hubs, single Bushcraft category. 306 launch articles, 836 reserve pool.
# Hub descriptions taken from Hub Strategy sheet notes.

categories:
  - slug: bushcraft
    label: Bushcraft
    hubs:
      - slug: knives
        label: Knives
        description: >-
          Research-based guides on bushcraft and fixed-blade knives, from Mora
          and ESEE to premium brand-direct makers.

      - slug: axes
        label: Axes
        description: >-
          Gransfors Bruks, Hults Bruk, Council Tool, and Fiskars — axes for
          camp use, felling, and traditional woodcraft.

      - slug: saws
        label: Saws
        description: >-
          Folding saws and bow saws for field use: Silky, Bahco, Corona,
          and how to choose between them.

      - slug: fire
        label: Fire Making
        description: >-
          Ferro rods, fire starters, char cloth, tinders, and everything
          needed to make fire in the field.

      - slug: shelter
        label: Shelter
        description: >-
          Tarps, bedrolls, bivy bags, and hammocks for woodland camping
          and overnight bushcraft trips.

      - slug: cooking
        label: Camp Cooking
        description: >-
          Billy cans, kuksas, tin cups, tripods, and lightweight stoves
          for cooking over fire.

      - slug: water
        label: Water Treatment
        description: >-
          LifeStraw, Sawyer, Katadyn, and other filtration and purification
          options for backcountry water.

      - slug: packs
        label: Packs
        description: >-
          Duluth Pack, Frost River, Savotta, Fjallraven, and canvas and
          frame packs built for woodland travel.

      - slug: clothing
        label: Clothing
        description: >-
          Wool layers, waxed cotton, Filson, Fjallraven, and boonie hats
          for durability and weather protection in the field.

      - slug: cordage
        label: Cordage
        description: >-
          Paracord, bank line, tarred twine, and natural cordage for
          bushcraft lashing, binding, and camp use.

      - slug: navigation
        label: Navigation
        description: >-
          Suunto and Silva baseplate compasses, map reading, and traditional
          land navigation for woodland travel.

      - slug: skills
        label: Core Skills
        description: >-
          How-to guides on fire lighting, shelter building, knife skills,
          and foundational bushcraft technique.
