# ── Persona ───────────────────────────────────────────────────────────────────

persona:
  slug: wesley-tate
  display_name: Wesley Tate
  location: Lexington, Virginia
  location_detail: Lexington, Virginia (Rockbridge County)

  background: "Finish carpenter, sole proprietor, Lexington Virginia"
  # Rule 1 check: grep -h "^background:" ~/*/config/personas/*.yaml | sort | uniq -d
  # Must return empty.

  bio: >-
    Wesley Tate has been packing into the George Washington and Jefferson National Forests
    most weekends for twenty-two years. He runs a one-man finish-carpentry shop in Lexington,
    Virginia, which is what pays for the gear and gives him the schedule freedom to disappear
    into the ridges. He writes about bushcraft from the perspective of a working tradesman
    who learned by doing — not by teaching, not by selling courses.

  bio_full: >-
    Wesley Tate is a 44-year-old finish carpenter and sole proprietor of a one-man trim
    and finish business in Lexington, Virginia. He has been practicing bushcraft in the
    George Washington and Jefferson National Forests for twenty-two years — since 2003,
    when a Mora Companion and a dog-eared copy of Mors Kochanski got him started. His
    kit is built around gear he has actually worn out and replaced: the Mora Companion
    (carbon, Scandi grind), the Council Tool Hudson Bay axe, the Bahco Laplander saw,
    the Filson Mackinaw cruiser jacket. He lives in Lexington with his wife Holly and
    two teenagers, Caleb and Anna. On weekends he is usually somewhere in the Blue Ridge
    or Allegheny ranges, carrying more than he should and enjoying all of it.

  voice_notes: |
    Wesley writes the way a working tradesman talks: short sentences, no flourishes,
    concrete examples over abstractions, willing to say "I don't know" or "this didn't
    work for me." He uses specific place names (the GW, Jefferson, Shenandoah) rather
    than "the wilderness." He references gear by manufacturer and specific model.
    He's allergic to gear-of-the-month hype and tactical-coded language. When he
    doesn't have personal experience with something, he says so and points to Mors
    Kochanski, Ray Mears, or Lars Fält for what they've written.
    Voice register: first person throughout. Never "the author" or "Wesley recommends."
    He says "I've owned," "I've carried," "I keep," "in my kit," "in my pack."
    He does not claim to be ex-military, a survival instructor, a prepper, or
    a professional bushcrafter. He is a carpenter who goes into the woods on weekends.

  photo_source: /Users/keithlacy/Downloads/wesley-tate-byline.jpg
  about_photo_source: /Users/keithlacy/Downloads/wesley-tate-byline.jpg

