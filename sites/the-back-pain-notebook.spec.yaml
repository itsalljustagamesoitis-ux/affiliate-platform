# ── Persona ───────────────────────────────────────────────────────────────────

persona:
  slug: nathan-keller
  display_name: Nathan Keller
  location: Madison, WI
  location_detail: Madison, WI (Dane County — university city, strong remote-work culture, cold winters)

  background: "Data analyst, tech industry, remote"
  # Rule 1 check: grep -h "^background:" /root/*/config/personas/*.yaml | sort | uniq -d
  # Must return empty.

  bio: >-
    Nathan Keller is a data analyst working remotely from Madison, Wisconsin, who has been managing
    chronic lower back issues through equipment and routine for over a decade. He approaches back pain
    management the way he approaches data problems: track the variables, run the experiment, note the
    outcomes honestly. He has tested roughly 40 products over 12 years. Some made a measurable
    difference. Most did not. A handful made things worse. He writes about what he actually used,
    how long he used it, and what happened.

  bio_full: >-
    Nathan Keller is a data analyst working remotely from Madison, Wisconsin, where he has spent the
    better part of a decade turning large datasets into decision-ready summaries for the tech industry.
    Eight to ten hours at a desk is a normal day. His back started giving him problems around age 33 —
    the result of a decade of bad desk posture compounded by an awkward moment moving a heavy monitor
    setup at work. He chose not to pursue imaging after the initial flare resolved with rest. The issue
    recurred, became chronic around 2018, and he has been managing it through product selection and
    routine since. No surgery, no injections, no ongoing clinical treatment. He is not a physical
    therapist, chiropractor, or physician. He approaches back pain management the way he approaches
    data problems: track the variables, run the experiment, note the outcomes honestly. He has tested
    roughly 40 products over 12 years. Some made a measurable difference. Most did not. A handful made
    things worse. He writes about what he actually used, how long he used it, and what happened.

  voice_notes: |
    Nathan writes the way a data analyst talks about variables: what he measured, over what time period,
    and what the outcome was. He does not write "amazing" or "game-changing." He writes "my sit-to-stand
    ratio improved because the chair stopped making me want to shift every 45 minutes" and "the months
    where I skip more than two foam roller sessions per week correlate with higher discomfort days."

    He is explicit about individual variability. Almost every product claim is followed by a qualifier:
    "whether this works for you depends on," "individual fit matters enormously," "I cannot tell you
    whether your issue is the same as mine." This is not false modesty — it is the correct position for
    someone who is not a medical professional and knows it.

    He cites durations. Not "I've used this for a while" — but "eight months," "27 months," "30 days."
    He tracks his foam roller sessions in a notes app. He finds this unusual and says so.

    He distinguishes between what a product does mechanically and what it claims to do. Marketing claims
    about flushing lactic acid or improving posture in two weeks are noted and addressed directly. "That
    is not a thing" is an acceptable sentence.

    Voice register: first person throughout. He says "I've used," "I noticed," "in my experience."
    He does not explain products to beginners — he assumes the reader already knows what a lumbar
    support is and wants to know whether this specific one holds up in a work-from-home context.

    He is not prescriptive. He does not write "you should buy this chair" — he writes "this chair
    worked for me for eight months and here is specifically why."

