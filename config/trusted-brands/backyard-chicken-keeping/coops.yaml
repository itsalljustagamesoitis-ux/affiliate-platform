# Per-hub trusted-brand list for HEAD-article sourcing (direct brand lookup,
# not generic keyword search — see search_by_brand_terms() in
# tools/source-products-rainforest.py). Source: chickens-launch-100.csv
# merchant_route for hub_slug=coops. Carolina Coops / Chicken Coop Company
# excluded -- DTC-only, not sold on Amazon (Amazon-only decision).
#
# Search terms are the bare product-line name, NOT "<brand> chicken coop" --
# appending "chicken coop" diluted Amazon's own search relevance toward
# Omlet's accessories (waterer, door opener) instead of the actual coop.
# Confirmed live: "Omlet Eglu Cube" surfaces the real coop (31 reviews);
# "Omlet Eglu Cube chicken coop" does not.
#
# Zylina dropped entirely -- confirmed live, a bare "Zylina" search returns
# only a 2-review waterer/feeder combo and unrelated pet-habitat products,
# no viable coop at any review count. Not a search-term problem; Zylina
# doesn't appear to sell a standalone coop on Amazon worth recommending.
- brand: Omlet
  search_terms:
    - "Omlet Eglu Cube"
    - "Eglu Go Up"
    # "Omlet Eglu Go Up" (with the Omlet prefix) returns zero results:
    # confirmed live, this exact 4-word phrase doesn't match anything on
    # Amazon's side. "Eglu Go Up" alone surfaces the real 22-review listing
    # ("Omlet Portable Chicken Coop Go Up") -- brand-match still verifies
    # via title substring since Rainforest doesn't return a brand field for
    # this ASIN.
- brand: OverEZ
  search_terms:
    - "OverEZ chicken coop kit"
