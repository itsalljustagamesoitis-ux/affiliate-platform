# Master cross-vertical forbidden vocabulary
#
# Used by scripts/preflight.py check 1 (scaffold-contamination).
#
# When preflight runs for site X, it loads all sections EXCEPT the one
# matching site X's own vertical (detected from site.config.yaml niche field).
# Any term found in content/articles/ or src/pages/ from a foreign section = FAIL.
#
# Vertical detection: preflight matches site niche against the `niche_keywords`
# list in each section. First match wins. Override with `vertical: <key>` in
# site.config.yaml to skip auto-detection.
#
# Guidelines for term selection:
#  - Terms must be sufficiently specific to their vertical (not generic English words)
#  - Abbreviations and acronyms only if they're industry-specific (RIC, BTE = hearing aids)
#  - Brand names only if they're closely associated with one vertical (Shimano = cycling)
#  - Exclude terms that appear legitimately in multiple verticals (ISO, decibel)

hearing_aids:
  niche_keywords:
    - hearing
    - audiology
    - hearing aid
    - assistive listening
  terms:
    - "hearing aid"
    - "hearing aids"
    - "audiologist"
    - "audiological"
    - "audiology"
    - "otoscope"
    - "tinnitus"
    - "cochlear"
    - "earmold"
    - "audiogram"
    - "audiologist"
    - "hearing test"
    - "RIC hearing"
    - "BTE hearing"
    - "ITE hearing"
    - "behind-the-ear"
    - "in-the-ear"
    - "receiver-in-canal"
    - "OTC hearing"
    - "over-the-counter hearing"
    - "hearing loss compensation"
    - "sensorineural"
    - "conductive hearing"
    - "dB HL"
    - "audiometric"
    - "Oticon"
    - "Phonak"
    - "Signia"
    - "Starkey hearing"
    - "Widex"
    - "ReSound hearing"

