# Hub-level defaults for sourced products.
#
# When source-products-rainforest.py creates a new product record it has no
# editorial data — only ASIN, title, and brand from the Rainforest response.
# These templates supply the required structural fields so the product passes
# test_all_products_have_required_fields without a manual pass.
#
# Fields per template:
#   price_band      budget | mid | premium  (typical for this hub)
#   notes_for_writers  Short editorial note for the article writer
#
# Curators should override notes_for_writers and price_band on any product
# where the auto-assigned default is wrong.

# ── Camera Bodies ────────────────────────────────────────────────────────────

cameras-mirrorless:
  price_band: mid
  notes_for_writers: >
    Cover sensor size, AF speed, and video specs. Note body-only vs kit-lens pricing.
    Verify current price — mirrorless bodies fluctuate frequently.

cameras-dslr:
  price_band: mid
  notes_for_writers: >
    Highlight optical viewfinder advantage and lens ecosystem breadth.
    Note that DSLRs are a declining category; position accordingly.

cameras-sony:
  price_band: mid
  notes_for_writers: >
    Emphasise Eye AF and real-time tracking. Note Alpha ecosystem lens availability.

cameras-canon:
  price_band: mid
  notes_for_writers: >
    Cover RF mount advantages and compatibility with EF lenses via adapter.

cameras-nikon:
  price_band: mid
  notes_for_writers: >
    Highlight Z-mount optical quality and backward compatibility with F-mount glass.

cameras-fujifilm:
  price_band: mid
  notes_for_writers: >
    Lead with film simulations and APS-C sensor philosophy. Note X-mount lens range.

cameras-general:
  price_band: mid
  notes_for_writers: >
    Buying guide article. Cover sensor size tradeoffs, mirrorless vs DSLR, and budget tiers.

# ── Lenses ───────────────────────────────────────────────────────────────────

lenses-prime:
  price_band: mid
  notes_for_writers: >
    Cover max aperture, rendering character, and autofocus speed. Note mount compatibility.

lenses-zoom:
  price_band: mid
  notes_for_writers: >
    Emphasise zoom range convenience vs prime sharpness tradeoff. Cover IS/VR systems.

lenses-macro:
  price_band: mid
  notes_for_writers: >
    Specify 1:1 vs 1:2 reproduction ratio. Cover working distance and focus stacking use.

lenses-telephoto:
  price_band: premium
  notes_for_writers: >
    Cover reach, image stabilisation, and wildlife/sports suitability. Note weight.

lenses-portrait:
  price_band: premium
  notes_for_writers: >
    Lead with bokeh quality, sharpness at wide apertures, and subject separation.

lenses-wide-angle:
  price_band: mid
  notes_for_writers: >
    Cover distortion control, edge sharpness, and architecture/landscape use cases.

lenses-general:
  price_band: mid
  notes_for_writers: >
    Buying guide. Cover focal length, aperture, and mount system selection.

# ── Bags & Cases ─────────────────────────────────────────────────────────────

bags-backpacks:
  price_band: budget
  notes_for_writers: >
    Cover carry capacity (bodies + lenses), laptop sleeve, and weather protection.

bags-shoulder:
  price_band: budget
  notes_for_writers: >
    Highlight quick-access design and urban carry comfort. Note weather sealing.

bags-sling:
  price_band: budget
  notes_for_writers: >
    Cover one-shoulder wear, rotation ease, and camera access speed.

bags-hard-cases:
  price_band: mid
  notes_for_writers: >
    Emphasise IP rating, pressure valves, and airline carry-on compliance.

bags-general:
  price_band: budget
  notes_for_writers: >
    Buying guide. Cover bag type (backpack vs shoulder vs sling) and fit for use case.

# ── Tripods & Support ────────────────────────────────────────────────────────

tripods:
  price_band: mid
  notes_for_writers: >
    Cover max load, height range, material (carbon vs aluminium), and leg lock type.

monopods:
  price_band: budget
  notes_for_writers: >
    Note load capacity and sports/wildlife walking use cases. Cover feet/base options.

gimbals:
  price_band: mid
  notes_for_writers: >
    Cover stabilisation axes, payload, battery life, and app features.

ballheads-plates:
  price_band: mid
  notes_for_writers: >
    Cover clamp standard (Arca-Swiss vs proprietary), friction control, and max load.

# ── Lighting & Studio ────────────────────────────────────────────────────────

flash-speedlights:
  price_band: mid
  notes_for_writers: >
    Cover GN, recycle time, HSS support, and TTL compatibility with camera brand.

studio-lighting:
  price_band: mid
  notes_for_writers: >
    Cover power output (Ws), modelling lamp, and wireless trigger system.

light-modifiers:
  price_band: budget
  notes_for_writers: >
    Cover size, light quality, ease of setup, and mount compatibility.

reflectors-diffusers:
  price_band: budget
  notes_for_writers: >
    Note surface options (gold/silver/white/diffuse) and collapsible storage size.

# ── Accessories ──────────────────────────────────────────────────────────────

memory-cards:
  price_band: budget
  notes_for_writers: >
    Lead with read/write speed (MB/s), capacity, and camera compatibility (CFexpress vs SD).

camera-batteries:
  price_band: budget
  notes_for_writers: >
    State mAh capacity, compatible camera models, and decode cells (OEM vs third-party).

lens-filters:
  price_band: budget
  notes_for_writers: >
    Cover filter type (ND / CPL / UV), thread size, and coatings.

cleaning-gear:
  price_band: budget
  notes_for_writers: >
    Note sensor safe vs lens safe classification. Cover kit contents.

accessories-general:
  price_band: budget
  notes_for_writers: >
    General camera accessories buying guide.

# ── Drones & Aerial ──────────────────────────────────────────────────────────

drones:
  price_band: premium
  notes_for_writers: >
    Cover camera sensor, flight time, obstacle avoidance, and regulatory class.

drone-accessories:
  price_band: budget
  notes_for_writers: >
    Specify compatible drone models. Cover ND filter sets, extra batteries, carry cases.

# ── Editing & Workflow ───────────────────────────────────────────────────────

editing-software:
  price_band: budget
  notes_for_writers: >
    Cover subscription vs perpetual licence, RAW format support, and AI features.

storage-backup:
  price_band: mid
  notes_for_writers: >
    Cover capacity, read/write speed, and workflow (NAS vs portable vs cloud hybrid).

monitors-displays:
  price_band: premium
  notes_for_writers: >
    Cover colour gamut (DCI-P3/sRGB coverage), calibration support, and resolution.

# ── Sauna Niche ───────────────────────────────────────────────────────────────

sauna-infrared:
  price_band: premium
  notes_for_writers: >
    Highlight heating technology (carbon vs ceramic vs full spectrum), interior space,
    EMF rating if disclosed, and typical session duration. Note brand warranty terms.

sauna-outdoor:
  price_band: premium
  notes_for_writers: >
    Cover construction material (cedar, thermo wood, hemlock), weather rating, footprint
    and installation requirements, and heater compatibility.

sauna-indoor:
  price_band: premium
  notes_for_writers: >
    Cover electrical requirements, space needed, ventilation considerations, and whether
    a permit is typically required for indoor installation.

sauna-traditional:
  price_band: premium
  notes_for_writers: >
    Note heater type (electric vs wood), stone capacity, humidity range, and the
    authentic löyly experience. Reference Finnish tradition where relevant.

sauna-steam:
  price_band: premium
  notes_for_writers: >
    Distinguish steam sauna (high humidity, lower temp) from dry Finnish sauna.
    Cover steam generator specs, moisture management, and installation requirements.

sauna-wood-fired:
  price_band: premium
  notes_for_writers: >
    Cover wood consumption rate, heating time to temperature, and safety clearances.
    Note that wood-fired saunas generally require no electricity.

sauna-portable:
  price_band: mid
  notes_for_writers: >
    Assess setup time, electrical requirements, capacity, and storage when not in use.
    Note that heat distribution in portable units varies significantly by design.

sauna-by-size:
  price_band: premium
  notes_for_writers: >
    Assess interior bench layout, electrical requirements, typical session capacity,
    and footprint. Note that "person" ratings are often optimistic for comfort.

sauna-heaters:
  price_band: mid
  notes_for_writers: >
    Cover power rating (kW), stone capacity, heating method (electric vs wood),
    control type (manual vs digital), and room size compatibility.

sauna-stones:
  price_band: budget
  notes_for_writers: >
    Cover stone type (olivine, peridotite, etc.), size, and compatibility with heater.
    Note replacement frequency and safe sourcing to avoid stones that crack under heat.

sauna-components:
  price_band: mid
  notes_for_writers: >
    Specify the component type (door, bench, vent, lighting, foil). Cover material
    quality, compatibility with common sauna sizes, and installation complexity.

sauna-materials:
  price_band: mid
  notes_for_writers: >
    Cover wood species characteristics (durability, heat resistance, splintering risk),
    typical use case, and treatment/finishing requirements.

sauna-accessories:
  price_band: budget
  notes_for_writers: >
    Note compatibility with major sauna brands/materials, build quality, and the specific
    in-sauna experience the accessory improves (thermometer, bucket, ladle, etc.).

sauna-diy:
  price_band: mid
  notes_for_writers: >
    Cover material list, electrical and permit requirements, skill level required,
    and total cost range. Be accurate about complexity — underestimating DIY is a
    common reader pain point.

sauna-prefab:
  price_band: premium
  notes_for_writers: >
    Cover what's included vs what requires site prep, delivery method, assembly time,
    and warranty. Note electrical connection requirements.

sauna-installation:
  price_band: budget
  notes_for_writers: >
    Focus on requirements (electrical, clearances, ventilation) rather than product
    recommendations. Reference applicable building codes where known. Advise licensed
    electrician for wiring work.

sauna-maintenance:
  price_band: budget
  notes_for_writers: >
    Cover specific maintenance task (cleaning, wood treatment, heater service, element
    replacement). Cite manufacturer recommendations where available.

sauna-health:
  price_band: budget
  notes_for_writers: >
    Use qualified language only ("may support", "research suggests"). Cite specific
    sources (ESPA Foundation, peer-reviewed studies). Never make definitive medical
    claims. Marcus is NOT a wellness practitioner — frame as a curious researcher.

sauna-how-to:
  price_band: budget
  notes_for_writers: >
    Cover temperature, duration, frequency, and technique. Acknowledge individual
    variation. Use sourced framing: "Finnish tradition recommends...", "r/Sauna
    users report...". No medical advice.

sauna-cold-plunge:
  price_band: premium
  notes_for_writers: >
    Cover capacity, chiller power, cooling speed, and required electrical supply.
    Frame as companion to sauna, not standalone wellness equipment.

sauna-hot-tub-combo:
  price_band: premium
  notes_for_writers: >
    Address space planning and electrical load (hot tub + sauna together are significant).
    Cover brands that design specifically for sauna adjacency.

sauna-blankets:
  price_band: budget
  notes_for_writers: >
    Distinguish non-infrared sauna blankets from infrared versions. Cover material,
    temperature range, and cleaning/hygiene considerations.

sauna-infrared-blankets:
  price_band: mid
  notes_for_writers: >
    Cover heating element type (carbon vs ceramic), EMF rating, temperature range,
    and session duration guidance. Note portability vs full sauna comparison.

sauna-infrared-mats:
  price_band: mid
  notes_for_writers: >
    Cover heating element layout, EMF rating, temperature range, and surface area.
    Note typical use cases (targeted recovery vs full-body infrared).

sauna-budget:
  price_band: budget
  notes_for_writers: >
    Be honest about tradeoffs at this price point — material quality, heating consistency,
    warranty support. Help buyers understand what they're getting.

sauna-mid-range:
  price_band: mid
  notes_for_writers: >
    Position this tier as the sweet spot for most buyers. Cover what upgrades
    justify mid-range pricing vs budget alternatives.

sauna-premium:
  price_band: premium
  notes_for_writers: >
    Cover what premium pricing buys: build quality, warranty, technology (e.g.
    Sunlighten Solocarbon, Clearlight True Wave), and service/support.

sauna-general:
  price_band: mid
  notes_for_writers: >
    General sauna buying guide. Cover sauna type selection, sizing, budget tiers,
    and key purchase decision factors from Marcus's research perspective.

sauna-home:
  price_band: premium
  notes_for_writers: >
    Cover whole-home sauna considerations: type selection, placement, electrical
    requirements, and how to evaluate contractor-installed vs prefab options.

sauna-reviews:
  price_band: mid
  notes_for_writers: >
    Marcus's sourced review framing. Lead with Harvia/Sunlighten/Clearlight
    specifications, r/Sauna community reports, and SaunaSeeker testing data.
    Never claim personal hands-on testing for products not in the eeat-vault.

sauna-commercial:
  price_band: premium
  notes_for_writers: >
    Focus on capacity, durability, code compliance, and commercial-grade heater
    specs. Note that commercial installation requirements differ from residential.

# Brand hubs — generic template; individual brand notes in eeat-vault.json

sauna-brand-harvia:
  price_band: mid
  notes_for_writers: >
    Finnish brand, market leader in traditional sauna heaters. Cover specific model
    within the Harvia lineup (Cilindro, Globe, Club, etc.), kW rating, and controls.

sauna-brand-clearlight:
  price_band: premium
  notes_for_writers: >
    Cover True Wave II carbon/ceramic hybrid heating technology and low-EMF claims.
    Note specific model (Premier, Sanctuary, etc.) and interior dimensions.

sauna-brand-sunlighten:
  price_band: premium
  notes_for_writers: >
    Cover Solocarbon heating technology, published EMF testing, and specific model
    (Solo, Amplify, Signature, mPulse). Note customisation and warranty terms.

sauna-brand-almost-heaven:
